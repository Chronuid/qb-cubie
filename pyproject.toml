[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cubie"
version = "0.0.3"
requires-python = ">=3.13"
dependencies = [
    "pytest==9.2.0",
    "msgspec>=0.22.0",
    "fsspec==2026.9.0",
    "path>=17.1.1",
    "loky==3.7.0",
    "cloudpickle",
    "packaging==26.3",
    "ruff==0.17.4",
    "pylint==4.1.3",
    "libcst>=1.9.0",
    "mypy==2.4.1",
]

[project.optional-dependencies]
dev = ["hypothesis==6.168.3", "pytest-xdist>=3.8,<4"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cubie*"]
exclude = ["cubie.arenas.arena_envs.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
