[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qb-cubie"
version = "0.0.4"
description = "Declarative acceptance tests, reviews, and static code analysis for Python"
readme = "README.md"
authors = [{name = "Dominick Wirzba"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "msgspec>=0.22,<0.23",
    "loky>=3.7,<4",
    "cloudpickle>=3.1.2,<4",
    "packaging>=26.3,<27",
]

[project.optional-dependencies]
linters = ["libcst>=1.9,<2", "mypy>=2.4.1,<3", "pylint>=4.1.3,<5"]
benchmarks = ["pytest>=9.2,<10"]
swebench = ["pyarrow>=19,<24"]

[project.scripts]
cubie-bench = "cubie_benchmarks.cli:main"

[project.urls]
Homepage = "https://github.com/Chronuid/qb-cubie"
Repository = "https://github.com/Chronuid/qb-cubie"
Issues = "https://github.com/Chronuid/qb-cubie/issues"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.168.3",
    "pytest-xdist>=3.8,<4",
    "ruff==0.17.4",
    "libcst==1.9.0",
    "mypy==2.4.1",
    "pylint==4.1.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src", "experiments/ollama-agents", "experiments/benchmarks"]
include = ["qb_cubie", "qb_cubie.*", "ollama_agents", "ollama_agents.*", "cubie_benchmarks", "cubie_benchmarks.*"]
exclude = ["qb_cubie.arenas.arena_envs.*"]
namespaces = false

[tool.setuptools.package-dir]
"" = "src"
ollama_agents = "experiments/ollama-agents/ollama_agents"
cubie_benchmarks = "experiments/benchmarks/cubie_benchmarks"

[tool.setuptools.package-data]
"cubie_benchmarks" = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not slow'"
markers = [
    "fast: Fast unit and contract tests (default local suite)",
    "slow: Heavy, scaling, subprocess-heavy, watchdog-timeout, or network tests",
    "ebt: Core EBT engine and contract tests",
    "arena: Arena isolation, TempFS, PyVenv, IPC, and resource-limit tests",
    "multiprocess: Multiprocessing backend, scaling, and xdist tests",
    "linter: Linter integration tests (Ruff, Pylint, MyPy, LibCST)",
    "services: Service tests such as DocEnsurance",
    "workflows: User workflow and acceptance tests",
    "reviewer: RBT and human/headless reviewer tests",
    "meta: Repository meta-contracts, styleguide, and offline/tk checks",
    "lint: Static analysis and documentation checks (ruff, pylint, mypy, docs)",
    "hypothesis: Property-based tests using Hypothesis",
]
