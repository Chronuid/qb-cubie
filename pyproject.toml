[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qb-cubie"
version = "0.0.3"
description = "Declarative acceptance tests, reviews, and static code analysis for Python"
readme = "README.md"
authors = [{name = "Dominick Wirzba"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.22,<0.23",
    "loky>=3.7,<4",
    "cloudpickle>=3.1.2,<4",
    "packaging>=26.3,<27",
]

[project.optional-dependencies]
linters = ["libcst>=1.9,<2", "mypy>=2.4.1,<3", "pylint>=4.1.3,<5"]
benchmarks = ["pytest>=9.2,<10"]
swebench = ["pyarrow>=19,<24"]

[project.scripts]
cubie-bench = "qb_cubie.benchmarks.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.168.3",
    "pytest-xdist>=3.8,<4",
    "ruff==0.17.4",
    "libcst==1.9.0",
    "mypy==2.4.1",
    "pylint==4.1.3",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src", "experiments/ollama-agents"]
include = ["qb_cubie", "qb_cubie.*", "ollama_agents", "ollama_agents.*"]
exclude = ["qb_cubie.arenas.arena_envs.*"]
namespaces = false

[tool.setuptools.package-dir]
"" = "src"
ollama_agents = "experiments/ollama-agents/ollama_agents"

[tool.setuptools.package-data]
"qb_cubie.benchmarks" = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
